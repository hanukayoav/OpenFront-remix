<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="fav-a-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c8ff"/>
      <stop offset="50%" stop-color="#0084d1"/>
      <stop offset="100%" stop-color="#004675"/>
    </linearGradient>
    <linearGradient id="fav-a-x" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#7cd6ff"/>
      <stop offset="100%" stop-color="#0084d1"/>
    </linearGradient>
    <radialGradient id="fav-a-core" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#142c4b"/>
      <stop offset="100%" stop-color="#060e19"/>
    </radialGradient>
  </defs>

  <!-- Outer Shield Silhouette (High-contrast for tab bars) -->
  <path d="M32 4 L53 9 L57 16 L55 38 L32 60 L9 38 L7 16 L11 9 Z"
        fill="#071322" stroke="url(#fav-a-shield)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Inner Plate Fill -->
  <path d="M32 8 L49 12 L52 18 L50 36 L32 54 L14 36 L12 18 L15 12 Z"
        fill="url(#fav-a-core)"/>

  <!-- Globe Ring in Upper Center -->
  <circle cx="32" cy="24" r="13" fill="none" stroke="#00c8ff" stroke-width="1.2" stroke-opacity="0.6"/>
  <ellipse cx="32" cy="24" rx="13" ry="5" fill="none" stroke="#0084d1" stroke-width="1" stroke-opacity="0.8"/>
  <line x1="32" y1="11" x2="32" y2="37" stroke="#0084d1" stroke-width="1" stroke-opacity="0.8"/>
  <!-- Glowing Continents Center Point -->
  <circle cx="32" cy="24" r="3" fill="#00c8ff"/>

  <!-- Bold High-Contrast Tactical "X" -->
  <!-- Top-Left to Bottom-Right Stroke -->
  <polygon points="17,17 23,13 47,43 41,47" fill="url(#fav-a-x)" stroke="#061220" stroke-width="0.8"/>
  <!-- Top-Right to Bottom-Left Stroke -->
  <polygon points="47,17 41,13 17,43 23,47" fill="url(#fav-a-x)" stroke="#061220" stroke-width="0.8"/>

  <!-- Center Core Command Light -->
  <polygon points="32,27 35,30 32,33 29,30" fill="#ffffff"/>
  <!-- Chevron Bottom Anchor Light -->
  <polygon points="32,50 35,53 32,56 29,53" fill="#00c8ff"/>
</svg>
